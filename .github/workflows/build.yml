name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project zip if present
        run: |
          if [ -f YTMilestones.zip ]; then
            unzip -q YTMilestones.zip
            echo "DIR=YTMilestones" >> $GITHUB_ENV
          else
            echo "DIR=." >> $GITHUB_ENV
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build APK
        working-directory: ${{ env.DIR }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: YT-Milestones-apk
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/*.apk
